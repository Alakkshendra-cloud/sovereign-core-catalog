{{- /*
  Control: mdb-aud-05 (iscf-mi-01 / iscf-dr-10)
  Fluent-bit DaemonSet for centralised log shipping from MongoDB VM audit logs.

  Opt-in via:
    logging:
      fluentbit:
        enabled: true
        siemEndpoint: "siem.example.com"
        siemPort: 5044
        tlsEnabled: true

  The DaemonSet mounts /var/log/mongodb from the host via hostPath and tails
  the MongoDB audit log, forwarding events to a sovereign SIEM endpoint over
  TLS. The pod runs as non-root with readOnlyRootFilesystem=true.

  Acceptance criteria:
    - DaemonSet runs non-root with readOnlyRootFilesystem: true
    - SIEM receives audit events within 60s of MongoDB write
    - helm lint passes
*/}}
{{- if .Values.logging.fluentbit.enabled }}
---
## ConfigMap: Fluent-bit configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb-vm.fullname" . }}-fluentbit-config
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipping
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    com.ibm.sovereigncore.compliance.control: "mdb-aud-05"
    com.ibm.sovereigncore.compliance.iscf-refs: "iscf-mi-01,iscf-dr-10"
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon       Off
        Log_Level    info
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Parsers_File parsers.conf

    ## Tail the MongoDB JSON audit log from the host
    [INPUT]
        Name              tail
        Path              /var/log/host-mongodb/audit.json
        Tag               mongodb.audit
        Parser            json
        Read_from_Head    true
        Refresh_Interval  5
        Rotate_Wait       30
        Skip_Long_Lines   On

    ## Tail the main mongod log from the host
    [INPUT]
        Name              tail
        Path              /var/log/host-mongodb/mongod.log
        Tag               mongodb.mongod
        Parser            json
        Read_from_Head    false
        Refresh_Interval  5
        Rotate_Wait       30
        Skip_Long_Lines   On

    ## Forward to sovereign SIEM over TCP (TLS handled by OUTPUT section)
    [OUTPUT]
        Name          forward
        Match         mongodb.*
        Host          {{ .Values.logging.fluentbit.siemEndpoint | quote }}
        Port          {{ .Values.logging.fluentbit.siemPort }}
        {{- if .Values.logging.fluentbit.tlsEnabled }}
        tls           On
        tls.verify    On
        {{- end }}

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%L

---
## DaemonSet: Fluent-bit log collector
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "mongodb-vm.fullname" . }}-fluentbit
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "mongodb-vm.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipping
  annotations:
    {{- include "mongodb-vm.annotations" . | nindent 4 }}
    com.ibm.sovereigncore.compliance.control: "mdb-aud-05"
    com.ibm.sovereigncore.compliance.iscf-refs: "iscf-mi-01,iscf-dr-10"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mongodb-vm.name" . }}-fluentbit
      app.kubernetes.io/instance: {{ include "mongodb-vm.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mongodb-vm.name" . }}-fluentbit
        app.kubernetes.io/instance: {{ include "mongodb-vm.fullname" . }}
        app.kubernetes.io/component: log-shipping
    spec:
      ## Run on the same node as the MongoDB VM pod so /var/log/mongodb is reachable.
      ## Tolerations ensure the DaemonSet schedules on IBM Z worker nodes.
      tolerations:
        - key: arch
          operator: Equal
          value: s390x
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          ## Use Red Hat UBI-based Fluent-bit image from the certified catalog.
          ## Update tag to the latest available for your cluster version.
          image: registry.redhat.io/openshift-logging/fluentd-rhel9:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 2020
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            ## Config mounted read-only from ConfigMap
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            ## Host MongoDB log directory — read-only tail
            - name: mongodb-logs
              mountPath: /var/log/host-mongodb
              readOnly: true
            ## Writable tmp for Fluent-bit internal buffers (readOnlyRootFilesystem requires this)
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: {{ include "mongodb-vm.fullname" . }}-fluentbit-config
        ## hostPath mount gives access to the VM guest's log files written via
        ## KubeVirt virtio-fs or the host's view of the guest disk bind-mounts.
        ## Path must match the MongoDB VM's /var/log/mongodb directory.
        - name: mongodb-logs
          hostPath:
            path: /var/log/mongodb
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      serviceAccountName: {{ include "mongodb-vm.val" (list . "serviceAccount.enabled") | eq "true" | ternary (include "mongodb-vm.fullname" .) "default" }}
{{- end }}
