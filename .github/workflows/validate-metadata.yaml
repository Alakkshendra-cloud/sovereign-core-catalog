name: Validate Metadata

on:
  pull_request:
    paths:
      - 'components/**/*.yaml'
      - 'companies/**/*.yaml'
      - 'schemas/**/*.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Validate SoftwareListing files
        run: |
          for file in $(find components/software -name 'metadata.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/software-metadata-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done

      - name: Validate HardwareProfile files
        run: |
          for file in $(find components/hardware -name 'metadata.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/hardware-metadata-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done

      - name: Validate ServiceProfile files
        run: |
          for file in $(find components/services -name 'metadata.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/service-metadata-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done

      - name: Validate ModelListing files
        run: |
          for file in $(find components/ai-models -name 'metadata.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/model-metadata-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done

      - name: Validate CompanyProfile files
        run: |
          for file in $(find companies -name 'profile.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/company-profile-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done

      - name: Validate SovereignCoreHelmMapping files
        run: |
          for file in $(find components/software -name 'values-mapping.yaml' 2>/dev/null); do
            echo "Validating $file"
            ajv validate -r schemas/common-definitions.yaml -s schemas/sovereigncore-helm-mapping-schema.yaml -d "$file" --spec=draft2020 -c ajv-formats || exit 1
          done
