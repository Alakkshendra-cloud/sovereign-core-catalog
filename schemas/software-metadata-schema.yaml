# JSON Schema (YAML representation) for SoftwareListing catalog entries.
# Authoritative schema — validates components/software/<slug>/<product>/<version>/metadata.yaml files.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sovereign-catalog.io/schemas/software-listing/v1alpha1"
title: SoftwareListing
description: >
  Schema for software catalog entries in the Sovereign Store.
type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    const: "sovereign-catalog.io/v1alpha1"
  kind:
    type: string
    const: SoftwareListing
  metadata:
    type: object
    required:
      - companyRef
      - vendor
      - product
      - version
      - shortDescription
      - fullDescription
      - sovereignCoreRelevance
      - industries
      - intendedUsers
      - category
      - availabilityState
      - lifecycleStatus
      - storefrontVisibility
    properties:
      companyRef:
        type: string
        pattern: "^companies/[a-z0-9][a-z0-9-]*[a-z0-9]$"
        description: "Relative path to the canonical company profile (e.g. companies/company-abc)."
      vendor:
        type: string
        description: "Legal entity name of the software vendor."
      product:
        type: string
        description: "Product display name."
      shortDescription:
        type: string
        description: "Short storefront summary for cards and carousel."
      fullDescription:
        type: string
        description: "Longer product description for detail views."
      sovereignCoreRelevance:
        type: string
        description: "Explanation of why this offering is relevant in sovereign or regulated environments."
      category:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/softwareCategory"
        description: "Primary storefront category for this software offering."
      industries:
        type: array
        items:
          $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/industry"
        description: "Industry segments this offering is intended for."
      intendedUsers:
        type: array
        items:
          type: string
        description: "Primary user roles or personas for this offering (e.g. Data scientists, AI engineers, Data architects, Compliance officers, Platform engineers)."
      version:
        type: string
        description: "Semantic version of the software release."
      lifecycleStatus:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/lifecycleStatus"
        description: "Current lifecycle state of this catalog entry. Drives storefront visibility and deployment eligibility."
      storefrontVisibility:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/storefrontVisibility"
        description: "Controls whether this entry appears in the public storefront (public), is accessible by direct link only (unlisted), or is hidden from all customers (private)."
      availabilityState:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/availabilityState"
        description: "Semantic availability state for storefront display and fulfillment handling."
    additionalProperties: false
  spec:
    type: object
    required:
      - architecture
      - security
      - deployment
    properties:
      certifications:
        type: array
        items:
          type: object
          required:
            - framework
            - status
          properties:
            framework:
              type: string
              description: "Compliance certification framework name (e.g., ISO-27001, SOC2, BSI-C5, FedRAMP-High)."
            status:
              $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/certificationStatus"
              description: "Current status of the compliance certification."
          additionalProperties: false
        description: "List of compliance certifications held by this product."
      openSource:
        type: object
        required:
          - enabled
          - license
        properties:
          enabled:
            type: boolean
            description: "Whether this software is distributed under an open-source licence."
          license:
            type: string
            description: "SPDX licence identifier (e.g. Apache-2.0, MIT, PostgreSQL) or name of proprietary licence."
          upstreamProject:
            type: string
            format: uri
            description: "URL of the upstream open-source project repository."
          upstreamVersion:
            type: string
            description: "Upstream version this build is based on."
          modifications:
            type: string
            description: "Human-readable summary of modifications made to the upstream project."
          sourceAvailable:
            type: boolean
            description: "Whether source code is publicly accessible even if not OSI-approved open source."
        additionalProperties: false
      jurisdiction:
        type: object
        required:
          - hq
        properties:
          hq:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/componentsCountryEnum"
            description: "Country/region where the vendor is headquartered."
          ultimateParentCompanyHQ:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/componentsCountryEnum"
            description: "Country/region of the ultimate parent company."
        additionalProperties: false
      architecture:
        type: object
        required:
          - format
          - airgapReady
        properties:
          format:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/deploymentFormat"
            description: "Target deployment platform."
          airgapReady:
            type: boolean
            description: "Whether the software can run with zero internet connectivity."
          dependencyEndpoints:
            type: array
            items:
              type: string
            description: "Explicit whitelist of external domains required. Empty array means fully air-gapped."
          storage:
            type: object
            properties:
              csiAccessModes:
                type: array
                items:
                  $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/csiAccessMode"
              volumeSnapshotSupport:
                type: boolean
            additionalProperties: false
          kubernetesCompatibility:
            type: object
            properties:
              minKubernetesVersionTested:
                type: string
              minOcpVersionTested:
                type: string
              maxKubernetesVersionTested:
                type: string
            additionalProperties: false
        additionalProperties: false
      security:
        type: object
        required:
          - podSecurityStandard
        properties:
          podSecurityStandard:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/podSecurityStandard"
            description: "Kubernetes Pod Security Standard level."
          requiresClusterAdmin:
            type: boolean
            description: "Whether the software requires cluster-admin RBAC."
          readOnlyRootFilesystem:
            type: boolean
            description: "Whether containers use a read-only root filesystem."
          kmsIntegration:
            type: boolean
            description: "Whether the software integrates with local KMS/HSM."
        additionalProperties: false
      deployment:
        type: object
        required:
          - type
          - repository
        properties:
          type:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/deploymentType"
            description: "Delivery mechanism for the software."
          repository:
            type: string
            description: "OCI registry URI for the deployment artifact."
        additionalProperties: false
      support:
        type: array
        description: "Named contacts who can be reached for queries about this software offering."
        items:
          type: object
          required:
            - email
          properties:
            name:
              type: string
              description: "Full name of the contact person (optional)."
            email:
              type: string
              format: email
              description: "Work email address of the contact person."
          additionalProperties: false
      links:
        type: object
        required:
          - productPageUrl
        properties:
          docsUrl:
            type: string
            format: uri
            description: "Public product documentation URL."
          productPageUrl:
            type: string
            format: uri
            description: "Canonical public product page URL."
        additionalProperties: false
      catalog:
        type: object
        description: "BYOP import settings read by scripts/import.sh. Optional; only for products imported into the platform."
        required:
          - sourceType
          - name
        properties:
          brokerType:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/brokerType"
            description: "Broker that serves this product."
          sourceType:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/sourceType"
            description: "Where the chart is fetched from."
          targetType:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/targetType"
            description: "Where the chart is delivered. Defaults to sourceType."
          name:
            type: string
            description: "Product id used to name the generated template."
          sourceRepo:
            type: string
            description: "Chart repository URL (OCI, HTTP, or Git)."
          sourceBranch:
            type: string
            description: "Git branch (helm-git only). Defaults to main."
          sourcePath:
            type: string
            description: "Chart path inside the Git repository (helm-git only)."
          chartName:
            type: string
            description: "Chart name inside the Helm chart repository."
          chartVersion:
            type: string
            description: "Chart version to pull from the Helm repository."
          images:
            type: array
            description: "Container images to mirror."
            items:
              type: object
              required:
                - source
                - destination
              properties:
                source:
                  type: string
                destination:
                  type: string
              additionalProperties: false
        additionalProperties: false
    if:
      not:
        type: object
        properties:
          openSource:
            type: object
            properties:
              enabled:
                const: true
            required:
              - enabled
        required:
          - openSource
    then:
      required:
        - jurisdiction
    additionalProperties: false
additionalProperties: false
