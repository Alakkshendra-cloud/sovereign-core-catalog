# JSON Schema (YAML representation) for ServiceProfile catalog entries.
# Authoritative schema — validates components/services/<slug>/<service>/metadata.yaml files.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sovereign-catalog.io/schemas/service-profile/v1alpha1"
title: ServiceProfile
description: >
  Schema for service partner catalog entries (hosting, audit, system integration,
  managed operations, etc.) in the Sovereign Store.
type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    const: "sovereign-catalog.io/v1alpha1"
  kind:
    type: string
    const: ServiceProfile
  metadata:
    type: object
    required:
      - companyRef
      - name
      - shortDescription
      - fullDescription
      - sovereignCoreRelevance
      - industries
      - intendedUsers
      - availabilityState
      - lifecycleStatus
      - storefrontVisibility
    properties:
      companyRef:
        type: string
        pattern: "^companies/[a-z0-9][a-z0-9-]*[a-z0-9]$"
        description: "Relative path to the canonical company profile (e.g. companies/infosys-eu)."
      name:
        type: string
        description: "Display name of the service partner entity."
      shortDescription:
        type: string
        description: "Short storefront summary for cards and carousel."
      fullDescription:
        type: string
        description: "Longer service description for detail views."
      sovereignCoreRelevance:
        type: string
        description: "Explanation of why this offering is relevant in sovereign or regulated environments."
      industries:
        type: array
        items:
          $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/industry"
        description: "Industry segments this offering is intended for."
      intendedUsers:
        type: array
        items:
          type: string
        description: "Primary user roles or personas for this offering (e.g. Platform teams, Compliance officers, Data architects)."
      lifecycleStatus:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/lifecycleStatus"
        description: "Current lifecycle state of this catalog entry. Drives storefront visibility and deployment eligibility."
      storefrontVisibility:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/storefrontVisibility"
        description: "Controls whether this entry appears in the public storefront (public), is accessible by direct link only (unlisted), or is hidden from all customers (private)."
      availabilityState:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/availabilityState"
        description: "Semantic availability state for storefront display and fulfillment handling."
    additionalProperties: false
  spec:
    type: object
    required:
      - serviceType
      - jurisdiction
    properties:
      certifications:
        type: array
        items:
          type: object
          required:
            - framework
            - status
          properties:
            framework:
              type: string
              description: "Compliance certification framework name (e.g., ISO-27001, SOC2, BSI-C5, FedRAMP-High)."
            status:
              $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/certificationStatus"
              description: "Current status of the compliance certification."
          additionalProperties: false
        description: "List of compliance certifications held by this product."
      serviceType:
        $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/serviceType"
        description: "Primary category of service offered by this partner."
      additionalServiceTypes:
        type: array
        items:
          $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/serviceType"
        description: "Secondary service categories also offered by this partner."
        uniqueItems: true
      jurisdiction:
        type: object
        required:
          - hq
        properties:
          hq:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/componentsCountryEnum"
            description: "Country/region where the partner entity is headquartered."
          ultimateParentCompanyHQ:
            $ref: "https://sovereign-catalog.io/schemas/common-definitions/v1alpha1#/$defs/componentsCountryEnum"
            description: "Country/region of the ultimate parent company."
          staffClearanceLevel:
            type: string
            description: "Security clearance level required for staff."
        additionalProperties: false
      capabilities:
        type: object
        properties:
          hosting:
            type: object
            description: "Hosting or infrastructure capability block."
            properties:
              providesBareMetal:
                type: boolean
              airGappedReady:
                type: boolean
            additionalProperties: true
        additionalProperties: true
      support:
        type: array
        description: "Named contacts who can be reached for queries about this service offering."
        items:
          type: object
          required:
            - email
          properties:
            name:
              type: string
              description: "Full name of the contact person (optional)."
            email:
              type: string
              format: email
              description: "Work email address of the contact person."
          additionalProperties: false
      links:
        type: object
        required:
          - productPageUrl
        properties:
          docsUrl:
            type: string
            format: uri
            description: "Public product documentation URL."
          productPageUrl:
            type: string
            format: uri
            description: "Canonical public product page URL."
        additionalProperties: false
    additionalProperties: false
additionalProperties: false
